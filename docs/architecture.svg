<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" width="1000" height="910" role="img" aria-label="APS digital twin on AWS architecture diagram">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff9900"/>
    </marker>
    <style>
      .tname{fill:#fff;font:700 13px 'Segoe UI',Arial,sans-serif}
      .tsub{fill:#8b949e;font:10px 'Segoe UI',Arial,sans-serif}
      .band-t{fill:#ff9900;font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}
      .cloud-t{fill:#8b949e;font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
      .flow{fill:#8b949e;font:italic 11px 'Segoe UI',Arial,sans-serif}
      .band{fill:#0f1622;stroke:#1e2833}
      .tile{fill:#1c2634;stroke:#2a3646}
    </style>
  </defs>

  <!-- background so it reads on any GitHub theme -->
  <rect x="0" y="0" width="1000" height="910" fill="#0d1117"/>
  <text x="34" y="34" fill="#ff9900" font="700 16px 'Segoe UI',Arial,sans-serif" font-weight="700" font-size="16" font-family="'Segoe UI',Arial,sans-serif">APS Digital Twin on AWS — Reference Architecture</text>

  <!-- AWS Cloud boundary (wraps ingest..present) -->
  <rect x="34" y="150" width="932" height="742" rx="14" fill="none" stroke="#3a4a60" stroke-dasharray="7 6"/>
  <text x="52" y="172" class="cloud-t">AWS CLOUD · us-east-1</text>

  <!-- Band 1: EDGE -->
  <rect x="60" y="58" width="880" height="78" rx="10" class="band"/>
  <text x="76" y="82" class="band-t">PLANT FLOOR · EDGE</text>
  <g transform="translate(400,74)">
    <rect width="220" height="50" rx="9" class="tile"/><rect width="220" height="6" rx="3" fill="#5a6b80"/>
    <text x="110" y="27" text-anchor="middle" class="tname">Sensors / PLCs</text>
    <text x="110" y="42" text-anchor="middle" class="tsub">Telegraf agents · line protocol</text>
  </g>

  <!-- Band 2: INGEST -->
  <rect x="60" y="196" width="880" height="86" rx="10" class="band"/>
  <text x="76" y="218" class="band-t">INGEST · AWS IoT</text>
  <g transform="translate(300,228)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#7AA116"/>
    <text x="90" y="26" text-anchor="middle" class="tname">AWS IoT Core</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">MQTT ingestion</text>
  </g>
  <g transform="translate(520,228)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#7AA116"/>
    <text x="90" y="26" text-anchor="middle" class="tname">IoT Rule</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">route → Lambda</text>
  </g>

  <!-- Band 3: STORE -->
  <rect x="60" y="322" width="880" height="118" rx="10" class="band"/>
  <text x="76" y="344" class="band-t">STORE · TIME SERIES</text>
  <rect x="286" y="352" width="470" height="78" rx="9" fill="none" stroke="#8C4FFF" stroke-dasharray="5 5"/>
  <text x="298" y="367" class="cloud-t" fill="#b48cff">AMAZON VPC · MULTI-AZ</text>
  <g transform="translate(300,374)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#ED7100"/>
    <text x="90" y="26" text-anchor="middle" class="tname">AWS Lambda</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">line-protocol writer</text>
  </g>
  <g transform="translate(510,368)">
    <rect width="230" height="56" rx="9" class="tile"/><rect width="230" height="6" rx="3" fill="#C925D1"/>
    <text x="115" y="28" text-anchor="middle" class="tname">Amazon Timestream for InfluxDB</text>
    <text x="115" y="45" text-anchor="middle" class="tsub">db.influx · port 8086 · Flux / InfluxQL</text>
  </g>

  <!-- Band 4: SERVE -->
  <rect x="60" y="480" width="880" height="86" rx="10" class="band"/>
  <text x="76" y="502" class="band-t">SERVE · QUERY API</text>
  <g transform="translate(300,512)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#ED7100"/>
    <text x="90" y="26" text-anchor="middle" class="tname">AWS Lambda</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">Flux query</text>
  </g>
  <g transform="translate(520,512)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#E7157B"/>
    <text x="90" y="26" text-anchor="middle" class="tname">Amazon API Gateway</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">REST</text>
  </g>

  <!-- Band 5: INTELLIGENCE -->
  <rect x="60" y="606" width="880" height="86" rx="10" class="band"/>
  <text x="76" y="628" class="band-t">INTELLIGENCE · GEN AI</text>
  <g transform="translate(300,638)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#01A88D"/>
    <text x="90" y="26" text-anchor="middle" class="tname">Bedrock AgentCore</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">agent runtime + tools</text>
  </g>
  <g transform="translate(520,638)">
    <rect width="180" height="48" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#01A88D"/>
    <text x="90" y="26" text-anchor="middle" class="tname">Amazon Bedrock</text>
    <text x="90" y="41" text-anchor="middle" class="tsub">Claude (reasoning)</text>
  </g>

  <!-- Band 6: PRESENT -->
  <rect x="60" y="732" width="880" height="140" rx="10" class="band"/>
  <text x="76" y="754" class="band-t">PRESENT · APS ON AWS</text>
  <g transform="translate(96,764)">
    <rect width="180" height="44" rx="9" class="tile"/><rect width="180" height="6" rx="3" fill="#8C4FFF"/>
    <text x="90" y="30" text-anchor="middle" class="tname">CloudFront + S3</text>
  </g>
  <g transform="translate(292,764)">
    <rect width="170" height="44" rx="9" class="tile"/><rect width="170" height="6" rx="3" fill="#DD344C"/>
    <text x="85" y="30" text-anchor="middle" class="tname">Amazon Cognito</text>
  </g>
  <g transform="translate(478,764)">
    <rect width="200" height="44" rx="9" class="tile"/><rect width="200" height="6" rx="3" fill="#ff9900"/>
    <text x="100" y="30" text-anchor="middle" class="tname">Autodesk APS APIs</text>
  </g>
  <g transform="translate(694,764)">
    <rect width="170" height="44" rx="9" class="tile"/><rect width="170" height="6" rx="3" fill="#5a6b80"/>
    <text x="85" y="30" text-anchor="middle" class="tname">APS Model Derivative</text>
  </g>
  <g transform="translate(292,822)">
    <rect width="386" height="42" rx="9" fill="#12202e" stroke="#ff9900"/>
    <text x="193" y="27" text-anchor="middle" class="tname" fill="#ffd9a6">Browser — APS Viewer + Gen-AI chat</text>
  </g>

  <!-- flow arrows (center spine) -->
  <line x1="500" y1="124" x2="500" y2="226" stroke="#ff9900" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="500" y1="276" x2="500" y2="372" stroke="#ff9900" stroke-width="2" marker-end="url(#arw)"/>
  <text x="510" y="308" class="flow">line protocol → 8086</text>
  <line x1="500" y1="424" x2="500" y2="510" stroke="#ff9900" stroke-width="2" marker-end="url(#arw)"/>
  <text x="510" y="460" class="flow">Flux query</text>
  <line x1="610" y1="560" x2="610" y2="636" stroke="#ff9900" stroke-width="2" marker-end="url(#arw)"/>
  <text x="620" y="592" class="flow">invoke agent</text>
  <line x1="480" y1="662" x2="392" y2="662" stroke="#4a5a6e" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="500" y1="560" x2="500" y2="785" stroke="#4a5a6e" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <text x="508" y="726" class="flow">answers + telemetry → viewer</text>
</svg>
